version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - DB_DATABASE=runwayhub_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: runwayhub_db
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
